# Secret -- креды к S3/MinIO (DVC remote, артефакты MLflow) и к Model Registry.
# В репозитории хранится только шаблон; реальные значения подставляет
# External Secrets Operator / Sealed Secrets / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: churn-secrets
  namespace: ml-prod
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "<from-vault>"
  AWS_SECRET_ACCESS_KEY: "<from-vault>"
  MLFLOW_S3_ENDPOINT_URL: "https://storage.yandexcloud.net"
