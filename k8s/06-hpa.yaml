# HorizontalPodAutoscaler -- автомасштабирование инференса под нагрузку:
# растёт RPS -> растёт CPU -> добавляются реплики. Прямо влияет на throughput
# сервиса и на стоимость в часы низкой нагрузки.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: churn-api
  namespace: ml-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: churn-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # не "дёргать" реплики на шуме трафика
